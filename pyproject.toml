[project]
name = "triage"
version = "0.1.0"
description = "SW 공급망 스캐닝 에이전트"
readme = "README.md"
authors = [
    { name = "chjpooh2002", email = "chjpooh2002@naver.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.12.0",
    "httpx>=0.28.1",
    "openai>=3.57.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "streamlit>=1.67.0",
    "typer>=0.29.2",
    "univers>=32.0.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
triage = "triage.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
